services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: ${PIHOLE_HOSTNAME:-pihole}
    domainname: ${PIHOLE_DOMAIN:-lan}
    network_mode: "host" # DNS policy is separate from the loopback web listener
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_dnssec: "true"
      FTLCONF_dns_listeningMode: "local"
      FTLCONF_webserver_port: "127.0.0.1:8081"
      # DNS filtering does not change host or client traffic routing.
      FTLCONF_dns_upstreams: ${PIHOLE_DNS:-1.1.1.1;1.0.0.1}
      FTLCONF_misc_etc_dnsmasq_d: ${PIHOLE_CUSTOM_DNSMASQ:-false}
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./tailscale/var-lib:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTHKEY: ${TS_AUTHKEY:-} # Generate at https://login.tailscale.com/admin/settings/keys
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: "--accept-dns=false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
      TS_USERSPACE: "false"
    restart: unless-stopped

  homer:
    image: b4bz/homer:latest
    container_name: homer
    ports:
      - "${ADMIN_BIND_IP:-127.0.0.1}:8080:8080" # http://PI-IP:8080
    volumes:
      - ./homer/assets:/www/assets
    environment:
      - INIT_ASSETS=1
      - TZ=${TZ}
    restart: unless-stopped

  speedtest-tracker:
    profiles: ["diagnostics"]
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    ports:
      - "${ADMIN_BIND_IP:-127.0.0.1}:8765:80" # http://PI-IP:8765
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      APP_KEY: ${SPEEDTEST_APP_KEY}
      APP_URL: ${SPEEDTEST_APP_URL}
      DB_CONNECTION: sqlite
      DISPLAY_TIMEZONE: ${TZ}
      SPEEDTEST_SCHEDULE: "0 */6 * * *" # run every 6 hours
      PRUNE_RESULTS_OLDER_THAN: 180 # keep 6 months of history (Pi 5 has plenty of storage)
    volumes:
      - ./speedtest-tracker/config:/config
    restart: unless-stopped

  netdata:
    init: true
    profiles: ["diagnostics"]
    image: netdata/netdata:latest
    container_name: netdata
    hostname: ${NETDATA_HOSTNAME:-rpi-netdata}
    ports:
      - "${ADMIN_BIND_IP:-127.0.0.1}:19999:19999" # http://PI-IP:19999
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    restart: unless-stopped

  portainer:
    profiles: ["administration"]
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "${ADMIN_BIND_IP:-127.0.0.1}:9443:9443" # https://PI-IP:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

  webtop:
    profiles: ["browser"]
    image: lscr.io/linuxserver/webtop:debian-xfce
    container_name: webtop
    ports:
      - "${ADMIN_BIND_IP:-127.0.0.1}:3002:3001" # https://PI-IP:3002
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - CUSTOM_USER=${WEBTOP_USER:-user}
      - PASSWORD=${WEBTOP_PASSWORD}
    volumes:
      - ./webtop/config:/config
    shm_size: "4g" # Pi 5 16GB can handle more for smoother browsing
    security_opt:
      - seccomp:unconfined # required for Docker-in-Docker if needed
    restart: unless-stopped

  # ===== Management & Monitoring Additions =====

  uptime-kuma:
    profiles: ["health"]
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    ports:
      - "${ADMIN_BIND_IP:-127.0.0.1}:3001:3001" # http://PI-IP:3001
    volumes:
      - ./uptime-kuma/data:/app/data
    restart: unless-stopped

  watchtower:
    profiles: ["legacy-updater"]
    image: containrrr/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * * # 6-field cron: sec min hour day month weekday (4 AM daily)
      - WATCHTOWER_ROLLING_RESTART=true
    restart: unless-stopped

  dozzle:
    profiles: ["administration"]
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "${ADMIN_BIND_IP:-127.0.0.1}:8888:8080" # http://PI-IP:8888
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  netdata_config:
  netdata_lib:
  netdata_cache:
  portainer_data:
