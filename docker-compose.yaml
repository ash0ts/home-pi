services:
  pihole:
    image: pihole/pihole:2026.09.0@sha256:5b9c8cf51de7d6d3f2240dbe72baf5f06e1fd39cb4d77a99fab4fa13e23bd1be
    container_name: pihole
    hostname: ${PIHOLE_HOSTNAME:-pihole}
    domainname: ${PIHOLE_DOMAIN:-lan}
    network_mode: "host" # DNS policy is separate from the loopback web listener
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_dnssec: "true"
      FTLCONF_dns_listeningMode: "local"
      FTLCONF_webserver_port: "127.0.0.1:8081"
      # DNS filtering does not change host or client traffic routing.
      FTLCONF_dns_upstreams: ${PIHOLE_DNS:-1.1.1.1;1.0.0.1}
      FTLCONF_misc_etc_dnsmasq_d: ${PIHOLE_CUSTOM_DNSMASQ:-false}
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    restart: unless-stopped
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}

  tailscale:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    container_name: tailscale
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./tailscale/var-lib:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTHKEY: ${TS_AUTHKEY:-} # Generate at https://login.tailscale.com/admin/settings/keys
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: "--accept-dns=false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
      TS_USERSPACE: "false"
    restart: unless-stopped
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}

  homer:
    image: b4bz/homer:v26.08.3@sha256:febc8967c9f7648ec37633ef3ae1ec90dbe8b7c46fecab80299f08f05be7ecb6
    container_name: homer
    ports:
      - "${ADMIN_BIND_IP:-127.0.0.1}:8080:8080" # http://PI-IP:8080
    volumes:
      - ./homer/assets:/www/assets
    environment:
      - INIT_ASSETS=1
      - TZ=${TZ}
    restart: unless-stopped
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
