services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    ports:
      - "${ADMIN_BIND_IP:-127.0.0.1}:8765:80" # http://PI-IP:8765
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      APP_KEY: ${SPEEDTEST_APP_KEY}
      APP_URL: ${SPEEDTEST_APP_URL}
      DB_CONNECTION: sqlite
      DISPLAY_TIMEZONE: ${TZ}
      SPEEDTEST_SCHEDULE: "0 */6 * * *" # run every 6 hours
      PRUNE_RESULTS_OLDER_THAN: 180 # keep 6 months of history (Pi 5 has plenty of storage)
    volumes:
      - ./speedtest-tracker/config:/config
    networks: [diagnostics]
    restart: unless-stopped

  netdata:
    init: true
    image: netdata/netdata:latest
    container_name: netdata
    hostname: ${NETDATA_HOSTNAME:-rpi-netdata}
    ports:
      - "${ADMIN_BIND_IP:-127.0.0.1}:19999:19999" # http://PI-IP:19999
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    networks: [diagnostics]
    restart: unless-stopped

volumes:
  netdata_config:
  netdata_lib:
  netdata_cache:

networks:
  diagnostics:
