name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install lint dependency
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt yamllint restic
      - name: Behavioral tests (isolated fixtures)
        run: ./tests/run.sh
      - name: Static Compose and shell validation (dummy configuration)
        run: ./scripts/validate.sh
      - name: Shell formatting
        run: shfmt -d -i 2 -ci setup.sh pi scripts/*.sh scripts/lib/*.sh tests/*.sh
      - name: YAML lint
        run: yamllint docker-compose.yaml modules .github/workflows .yamllint.yaml
      - name: Immutable image and ARM64 manifest verification
        run: python3 -B scripts/check_images.py --registry
      - name: Secret scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2, reviewed 2026-10-05
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
